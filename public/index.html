<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ein Workspace zum Öffnen ausdrücklich freigegebener Websites."
    />
    <title>Browse · Freigegebene Websites</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">BROWSE / AUTHORIZED ACCESS</p>
        <h1>Dein Workspace für freigegebene Websites.</h1>
        <p class="intro">
          Diese Anwendung ist kein Proxy und umgeht keine Netzwerksperren. Sie öffnet nur
          vom Betreiber ausdrücklich erlaubte Ziele und respektiert deren Sicherheitsrichtlinien.
        </p>
      </header>

      <section class="toolbar" aria-label="Navigation">
        <label for="address">Freigegebene Adresse</label>
        <div class="address-row">
          <input id="address" type="url" autocomplete="url" spellcheck="false" />
          <button id="open" type="button">Öffnen</button>
        </div>
        <p id="hint" class="hint" role="status"></p>
      </section>

      <section class="workspace" aria-label="Inhalt">
        <div class="workspace-header">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="destination">Lade Konfiguration …</span>
          <a id="external" target="_blank" rel="noopener noreferrer">In neuem Tab öffnen ↗</a>
        </div>
        <iframe id="viewer" title="Freigegebene Website" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
